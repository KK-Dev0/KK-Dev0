<svg xmlns="http://www.w3.org/2000/svg" width="480" height="210" viewBox="0 0 480 210">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/></linearGradient></defs>
<style>
.sh{stroke-dasharray:150 1050;animation:sh 5s linear infinite}@keyframes sh{to{stroke-dashoffset:-1200}}
.pd{animation:pd 2s ease-in-out infinite}@keyframes pd{50%{opacity:.25}}
.mt{animation:mt 1s ease-out both}@keyframes mt{from{opacity:0;transform:translateY(8px)}}
</style>
<rect x="1" y="1" width="478" height="208" rx="16" fill="#15112b" stroke="#2a2450" stroke-width="1.5"/>
<rect class="sh" x="1" y="1" width="478" height="208" rx="16" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
<text x="22" y="40" style="font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;font-size:21px;font-weight:700" fill="#ece9f8">TaskFlow</text>
<circle class="pd" cx="408" cy="34" r="4" fill="#4ade80"/><text x="418" y="38" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px" fill="#a29ec3">LIVE</text>
<text x="22" y="66" style="font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;font-size:14px" fill="#a78bfa">Task &amp; focus workspace</text>
<text x="22" y="92" style="font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;font-size:13px" fill="#a29ec3">Priorities, dashboard and a transparent</text>
<text x="22" y="112" style="font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;font-size:13px" fill="#a29ec3">rules-based planner</text>
<text class="mt" x="22" y="146" style="font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;font-size:30px;font-weight:700" fill="url(#g)">25/15/5</text>
<text x="151" y="146" style="font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;font-size:12px" fill="#a29ec3">minute focus timer</text>
<rect x="22" y="160" width="53" height="24" rx="12" fill="#241d4a"/><text x="48.5" y="176" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px" fill="#ece9f8">Flask</text><rect x="83" y="160" width="60" height="24" rx="12" fill="#241d4a"/><text x="113.0" y="176" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px" fill="#ece9f8">SQLite</text><rect x="151" y="160" width="88" height="24" rx="12" fill="#241d4a"/><text x="195.0" y="176" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px" fill="#ece9f8">JavaScript</text>
</svg>