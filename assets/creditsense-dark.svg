<text x="22" y="40" style="font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;font-size:21px;font-weight:700" fill="#ece9f8">CreditSense AI</text>
<circle class="pd" cx="408" cy="34" r="4" fill="#4ade80"/><text x="418" y="38" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px" fill="#a29ec3">LIVE</text>
<text x="22" y="66" style="font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;font-size:14px" fill="#a78bfa">Explainable credit-risk decision support</text>
<text x="22" y="92" style="font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;font-size:13px" fill="#a29ec3">Cost-based approve / review / decline</text>
<text x="22" y="112" style="font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;font-size:13px" fill="#a29ec3">with an age-group fairness audit</text>
